modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/TavariAgent/chunkoptimizer"
authors="TavariAgent"
description='''
ChunkOptimizer replaces Minecraft's stateless chunk dispatch pipeline with a
motion-vector spiral, adaptive cadence control, and an edge ticketer that seeds
world generation ahead of the player. Server-side only. Zero configuration required.
    '''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"